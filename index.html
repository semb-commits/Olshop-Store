<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olshopin Store</title>
<style>
  :root{
    --bg:#0f1115;
    --card:#1a1d23;
    --text:#f5f5f5;
    --muted:#9aa0a6;
    --accent:#4ade80;
    --border:#2a2f38;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
    background:var(--bg);
    color:var(--text);
    padding-bottom:100px;
  }
  header{
    padding:20px;
    text-align:center;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:10;
  }
  header h1{font-size:22px;font-weight:700}
  header p{color:var(--muted);font-size:14px;margin-top:4px}

 .container{padding:20px}
  h2{font-size:18px;margin-bottom:12px}

  /* Product slider */
 .slider{
    display:flex;
    gap:16px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding-bottom:10px;
    -webkit-overflow-scrolling:touch;
  }
 .slider::-webkit-scrollbar{display:none}
 .card{
    min-width:80%;
    scroll-snap-align:start;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    overflow:hidden;
    flex-shrink:0;
  }
 .card img{
    width:100%;
    height:220px;
    object-fit:cover;
    background:#000;
  }
 .card-body{padding:16px}
 .card h3{font-size:16px;margin-bottom:6px}
 .price{color:var(--accent);font-weight:700;margin-bottom:12px}

  /* Size selector */
 .sizes{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
 .size{
    padding:8px 14px;
    border:1px solid var(--border);
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
  }
 .size.active{
    border-color:var(--accent);
    background:rgba(74,222,128,0.1);
    color:var(--accent);
  }

  /* Order form */
 .form{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:20px;
    margin-top:30px;
  }
 .form label{display:block;font-size:14px;margin:12px 0 6px;color:var(--muted)}
 .form input,.form select,.form textarea{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid var(--border);
    background:#0d1014;
    color:var(--text);
    font-size:15px;
  }
 .form textarea{resize:none;height:80px}

 .btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--accent);
    color:#0f1115;
    font-weight:700;
    font-size:16px;
    margin-top:16px;
    cursor:pointer;
  }
 .btn:active{opacity:0.8}

 .note{
    font-size:13px;
    color:var(--muted);
    margin-top:10px;
    line-height:1.5;
  }
</style>
</head>
<body>

<header>
  <h1>Olshopin Store</h1>
  <p>Baju casual harga bersahabat</p>
</header>

<div class="container">
  <h2>Produk</h2>
  <div class="slider" id="productSlider">

    <div class="card" data-name="Kaos Polos Basic" data-price="75000">
      <img src="https://via.placeholder.com/400x500.png?text=Kaos+Polos" alt="Kaos Polos">
      <div class="card-body">
        <h3>Kaos Polos Basic</h3>
        <div class="price">Rp 75.000</div>
        <div class="sizes">
          <div class="size">S</div>
          <div class="size">M</div>
          <div class="size active">L</div>
          <div class="size">XL</div>
          <div class="size">XXL</div>
        </div>
      </div>
    </div>

    <div class="card" data-name="Hoodie Oversize" data-price="150000">
      <img src="https://via.placeholder.com/400x500.png?text=Hoodie" alt="Hoodie">
      <div class="card-body">
        <h3>Hoodie Oversize</h3>
        <div class="price">Rp 150.000</div>
        <div class="sizes">
          <div class="size">M</div>
          <div class="size active">L</div>
          <div class="size">XL</div>
          <div class="size">XXL</div>
        </div>
      </div>
    </div>

    <div class="card" data-name="Crewneck Cotton" data-price="120000">
      <img src="https://via.placeholder.com/400x500.png?text=Crewneck" alt="Crewneck">
      <div class="card-body">
        <h3>Crewneck Cotton</h3>
        <div class="price">Rp 120.000</div>
        <div class="sizes">
          <div class="size">S</div>
          <div class="size active">M</div>
          <div class="size">L</div>
          <div class="size">XL</div>
          <div class="size">XXL</div>
        </div>
      </div>
    </div>

  </div>

  <div class="form">
    <h2>Checkout</h2>

    <label>Produk</label>
    <select id="productSelect"></select>

    <label>Ukuran</label>
    <select id="sizeSelect">
      <option>S</option><option>M</option><option>L</option>
      <option>XL</option><option>XXL</option>
    </select>

    <label>Jumlah</label>
    <input type="number" id="qty" value="1" min="1">

    <label>Nama Lengkap</label>
    <input type="text" id="name" placeholder="Budi">

    <label>Alamat Lengkap</label>
    <textarea id="address" placeholder="Jl. Mawar No. 12, Jakarta Selatan"></textarea>

    <label>Kota/Kabupaten</label>
    <input type="text" id="city" placeholder="Jakarta Selatan">

    <label>Metode Pembayaran</label>
    <select id="payment">
      <option value="QRIS">QRIS</option>
      <option value="COD">COD</option>
      <option value="Transfer Bank">Transfer Bank</option>
    </select>

    <label>Estimasi Ongkir</label>
    <select id="shipping">
      <option value="15000">Jabodetabek - Rp 15.000</option>
      <option value="25000">Jawa Barat/Tengah/Timur - Rp 25.000</option>
      <option value="35000">Sumatera/Bali - Rp 35.000</option>
      <option value="50000">Kalimantan/Sulawesi - Rp 50.000</option>
      <option value="70000">Papua & Lainnya - Rp 70.000</option>
    </select>
    <div class="note">*Ongkir ini estimasi. Nanti akan dikonfirmasi ulang sama admin.</div>

    <button class="btn" onclick="sendOrder()">Kirim Pesanan via WhatsApp</button>
  </div>
</div>

<script>
  const products = document.querySelectorAll('.card');
  const productSelect = document.getElementById('productSelect');
  const sizeSelect = document.getElementById('sizeSelect');

  // Populate product dropdown from cards
  products.forEach((p,i)=>{
    const name = p.dataset.name;
    const price = p.dataset.price;
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${name} - Rp ${Number(price).toLocaleString('id-ID')}`;
    productSelect.appendChild(opt);

    // Size click handler
    p.querySelectorAll('.size').forEach(s=>{
      s.addEventListener('click',()=>{
        p.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));
        s.classList.add('active');
        if(productSelect.value==i) sizeSelect.value=s.textContent;
      });
    });
  });

  productSelect.addEventListener('change',()=>{
    const activeCard = products[productSelect.value];
    const activeSize = activeCard.querySelector('.size.active')?.textContent || 'L';
    sizeSelect.value = activeSize;
  });

  function sendOrder(){
    const p = products[productSelect.value];
    const productName = p.dataset.name;
    const productPrice = Number(p.dataset.price);
    const size = sizeSelect.value;
    const qty = Number(document.getElementById('qty').value);
    const name = document.getElementById('name').value;
    const address = document.getElementById('address').value;
    const city = document.getElementById('city').value;
    const payment = document.getElementById('payment').value;
    const shippingCost = Number(document.getElementById('shipping').value);
    const shippingText = document.getElementById('shipping').selectedOptions[0].text;

    if(!name ||!address ||!city){
      alert('Lengkapi data nama, alamat, dan kota dulu ya');
      return;
    }

    const total = productPrice*qty + shippingCost;

    const msg = `Halo Admin Olshopin 👋
Saya mau order:

📦 Produk: ${productName}
📏 Ukuran: ${size}
🔢 Jumlah: ${qty}
💰 Harga: Rp ${productPrice.toLocaleString('id-ID')}
🚚 Ongkir: ${shippingText}
💳 Total Bayar: Rp ${total.toLocaleString('id-ID')}

👤 Nama: ${name}
🏠 Alamat: ${address}, ${city}
💳 Pembayaran: ${payment}

Mohon info selanjutnya. Terima kasih!`;

    const waNum = '62895351432524'; // 08 ganti jadi 62
    const url = `https://wa.me/${waNum}?text=${encodeURIComponent(msg)}`;
    window.open(url,'_blank');
  }
</script>

</body>
  </html>
